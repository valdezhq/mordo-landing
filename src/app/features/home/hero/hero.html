  <section id="hero-section" class="hero-section">

  <div class="version-badge">
    <a routerLink="/changelog" class="changelog-badge">
      <span class="version-tag">v1.0.1</span>
      <span class="version-title">{{ 'hero.changelogTitle' | translate }}</span>
    </a>
  </div>

  <div class="hero-content">
    <h1 class="hero-title">Mordô</h1>
    <p class="hero-text" [innerHTML]="'hero.text' | translate"></p>
  </div>

  <div class="hero-buttons">
    <button nz-button nzType="primary" class="get-started-btn" routerLink="/documentation">
      {{ 'hero.getStarted' | translate }}
    </button>
    <button nz-button nzType="default" class="learn-more-btn" (click)="scrollToCards()">
      {{ 'hero.learnMore' | translate }}
    </button>
  </div>

  </section>
